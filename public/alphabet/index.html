  <style>
   body {
            /* Ensures body fills the viewport and centers content (App container) */
            display: flex; 
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f7f7f7;
            font-family: 'Inter', sans-serif;
        }
        /* Style the canvas container */
        #canvas-container {
            /* Basic styling for the canvas area */
            border-radius: 8px;
        }

        /* Style the container for the p5 input element */
        #input-wrapper {
            /* This div ensures the input bar is centered on the page */
            display: flex;
            justify-content: center;
            width: 100%;
        }
        /* Added max-width to the overall app container for better visual balance */
        #app-container {
            /* Allowing scrolling if content exceeds height */
            max-height: 100vh;
            overflow-y: auto; 
        }
        

  </style>
